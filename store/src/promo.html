<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Store promo tiles</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700;800&family=Noto+Sans+Hebrew:wght@400;700&display=block">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; font-family: "Noto Sans", "Noto Sans Hebrew", sans-serif; }
  .tile {
    position: relative; overflow: hidden; color: #fff;
    background: radial-gradient(circle at 85% 20%, #3b82f6, #1f4fbf 55%, #16338a);
    display: flex; align-items: center;
  }
  .logo {
    flex: none; border-radius: 22%; background: #fff;
    display: grid; align-content: center; justify-items: end;
  }
  .logo i { display: block; border-radius: 99px; background: #1f6feb; }
  h1 { margin: 0; font-weight: 800; letter-spacing: -.01em; }
  p { margin: 0; opacity: .92; }
  .he { font-family: "Noto Sans Hebrew", sans-serif; direction: rtl; }

  /* 440 x 280 */
  #small { width: 440px; height: 280px; gap: 22px; padding: 0 34px; }
  #small .logo { width: 96px; height: 96px; gap: 9px; padding: 0 20px; }
  #small .logo i { height: 8px; }
  #small h1 { font-size: 44px; }
  #small p { font-size: 17px; line-height: 1.35; margin-top: 4px; }

  /* 1400 x 560 */
  #marquee { width: 1400px; height: 560px; gap: 48px; padding: 0 90px; margin-top: 20px; }
  #marquee .logo { width: 170px; height: 170px; gap: 16px; padding: 0 36px; }
  #marquee .logo i { height: 14px; }
  #marquee h1 { font-size: 88px; }
  #marquee p { font-size: 30px; line-height: 1.3; margin-top: 6px; }
  #marquee .bubbles { margin-left: auto; display: flex; flex-direction: column; gap: 14px; width: 440px; }
  .bubble { background: #fff; color: #1c2430; border-radius: 16px; padding: 12px 18px; font-size: 22px; }
  .bubble.en { align-self: flex-start; }
  .bubble.rtl { direction: rtl; text-align: right; }
</style>
</head>
<body>
  <div class="tile" id="small">
    <div class="logo"><i style="width:56px"></i><i style="width:36px"></i><i style="width:48px"></i><i style="width:30px"></i></div>
    <div>
      <h1>Yamina</h1>
      <p>Auto RTL for Hebrew &amp; Arabic</p>
      <p class="he">עברית וערבית מימין לשמאל</p>
    </div>
  </div>

  <div class="tile" id="marquee">
    <div class="logo"><i style="width:98px"></i><i style="width:62px"></i><i style="width:84px"></i><i style="width:52px"></i></div>
    <div>
      <h1>Yamina</h1>
      <p>Auto RTL for Hebrew &amp; Arabic,<br>on any site you switch it on for.</p>
    </div>
    <div class="bubbles">
      <div class="bubble rtl">היי! העלית כבר את הקבצים?</div>
      <div class="bubble en">Yes, this morning.</div>
      <div class="bubble rtl">מעולה, תודה! אעבור עליהם היום.</div>
    </div>
  </div>
  <script>document.fonts.ready.then(() => { document.body.dataset.ready = '1'; });</script>
</body>
</html>
