<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Store screenshot — chat</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Sans+Hebrew:wght@400;600&family=Noto+Sans+Arabic:wght@400;600&display=block">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; width: 1280px; height: 800px; overflow: hidden;
    font: 17px/1.5 "Noto Sans", "Noto Sans Hebrew", "Noto Sans Arabic", sans-serif;
    background: linear-gradient(160deg, #eef3fb, #dde7f7);
    color: #1c2430;
    padding: 36px 48px;
  }
  .head { display: flex; align-items: center; gap: 16px; margin-bottom: 26px; }
  .logo {
    width: 52px; height: 52px; border-radius: 12px; background: #1f6feb;
    display: grid; align-content: center; justify-items: end; gap: 5px; padding: 0 11px;
  }
  .logo i { display: block; height: 4px; border-radius: 2px; background: #fff; }
  .head h1 { margin: 0; font-size: 30px; font-weight: 700; }
  .head p { margin: 0; color: #4a5566; font-size: 18px; }
  .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
  .label { font-weight: 700; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; margin: 0 0 10px 4px; }
  .before .label { color: #9a4b00; }
  .after .label { color: #1a7f37; }
  .window { background: #fff; border-radius: 14px; box-shadow: 0 10px 30px rgb(30 50 90 / .12); overflow: hidden; height: 600px; }
  .bar { padding: 14px 20px; border-bottom: 1px solid #e6eaf0; font-weight: 600; }
  .msgs { padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; }
  .row.me { justify-content: flex-end; }
  .bubble { max-width: 78%; padding: 9px 14px; border-radius: 14px; background: #f0f2f5; }
  .me .bubble { background: #d9e8ff; }
  .bubble p { margin: 0; }
  .bubble p + p, .bubble ul { margin-top: 4px; }
  .bubble ul { margin-bottom: 0; padding-left: 22px; }
</style>
</head>
<body>
  <div class="head">
    <div class="logo"><i style="width:30px"></i><i style="width:20px"></i><i style="width:26px"></i><i style="width:17px"></i></div>
    <div>
      <h1>Yamina</h1>
      <p>Hebrew and Arabic messages, the right way round — on any site you switch it on for.</p>
    </div>
  </div>
  <div class="panels">
    <section class="before"><p class="label">Without Yamina</p><div class="window"><div class="bar">Project chat</div><div class="msgs"></div></div></section>
    <section class="after"><p class="label">With Yamina</p><div class="window"><div class="bar">Project chat</div><div class="msgs"></div></div></section>
  </div>
  <script>
    const messages = [
      ['them', '<p>היי! העלית כבר את הקבצים לתיקייה המשותפת?</p>'],
      ['me', '<p>Yes, uploaded them this morning.</p>'],
      ['them', '<p>מעולה, תודה! אעבור עליהם אחרי הפגישה ואחזור אליך עם הערות.</p>'],
      ['me', '<p>אולי נקרא לכפתור Save draft במקום Submit?</p>'],
      ['them', '<p>شكراً! سأراجع الملفات اليوم وأرسل ملاحظاتي.</p>'],
      ['them', '<p>ועוד שני דברים:</p><ul><li>לעדכן את הכותרת בעמוד הראשי.</li><li>להוסיף צילום מסך חדש.</li></ul>'],
      ['me', '<p>Sure, I will handle both today.</p>'],
    ];
    for (const box of document.querySelectorAll('.msgs')) {
      box.innerHTML = messages.map(([who, html]) => `<div class="row ${who}"><div class="bubble">${html}</div></div>`).join('');
    }
  </script>
  <script src="common.js"></script>
</body>
</html>
